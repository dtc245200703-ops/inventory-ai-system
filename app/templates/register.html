<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký · Inventory AI</title><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/workspace.css"></head>
<body class="login-page"><main class="panel login-card"><div class="brand-icon">📦</div><h1>Đăng ký tài khoản</h1>
{% if first_admin %}<p>Thiết lập lần đầu: tài khoản đầu tiên sẽ là <strong>quản trị viên</strong>.</p>{% else %}<p>Tài khoản mới cần quản trị viên kích hoạt và phân quyền trước khi đăng nhập.</p>{% endif %}
<form id="registerForm"><label>Tên đăng nhập<input name="username" autocomplete="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_.-]+" title="Từ 3–50 ký tự: chữ không dấu, số, dấu chấm, gạch dưới hoặc gạch nối." autofocus></label><label>Email (không bắt buộc)<input name="email" type="email" autocomplete="email" maxlength="254"></label><label>Mật khẩu<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="passwordHint"></label><small id="passwordHint" class="muted">Ít nhất 10 ký tự.</small><label>Nhập lại mật khẩu<input name="password_confirmation" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label><button class="primary" type="submit">Đăng ký</button></form>
<p id="registerMessage" role="status" aria-live="polite"></p><p class="muted">Đã có tài khoản? <a href="/login" id="loginLink">Đăng nhập</a></p></main><script src="/static/js/register.js"></script></body></html>
